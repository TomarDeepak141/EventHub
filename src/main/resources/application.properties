spring.application.name=eventHub

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
spring.jpa.open-in-view=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
eventhub.reservation.ttl=${SEAT_RESERVATION_TTL:PT5M}
eventhub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
